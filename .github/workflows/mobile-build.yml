name: Mobile Build & Release (Android + iOS)

on:
  push:
    branches:
      - "feat/mobile"
      - "main"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional Release tag to upload Android APK & iOS IPA"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bootstrap native platform files & verify Dart/Flutter tests
        run: |
          bash mobile/scripts/setup_native.sh
          cd mobile
          flutter pub get
          flutter analyze
          flutter test --timeout 60s

  build-android:
    needs: mobile-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bootstrap Android project and build universal release APK
        run: |
          bash mobile/scripts/setup_native.sh
          cd mobile
          flutter pub get
          flutter build apk --release
          mkdir -p ../dist-mobile
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-mobile/AIProxyLauncher-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIProxyLauncher-Android-APK
          path: dist-mobile/AIProxyLauncher-Android.apk

      - name: Attach Android APK to GitHub Release (on tag or dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AI 代理启动器 $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist-mobile/AIProxyLauncher-Android.apk --repo "$GITHUB_REPOSITORY" --clobber

  build-ios:
    needs: mobile-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bootstrap iOS Xcode project & build unsigned IPA
        run: |
          bash mobile/scripts/setup_native.sh
          cd mobile
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p ../dist-mobile/Payload
          cp -R build/ios/iphoneos/Runner.app ../dist-mobile/Payload/Runner.app
          (cd ../dist-mobile && zip -qry AIProxyLauncher-iOS-unsigned.ipa Payload)
          rm -rf ../dist-mobile/Payload

          # Package clean Xcode project & Android/iOS platform scaffold (without Pods/build caches)
          mkdir -p ../dist-mobile/platforms
          rsync -a --exclude='Pods' --exclude='Flutter/ephemeral' --exclude='.symlinks' --exclude='build' ios ../dist-mobile/platforms/
          rsync -a --exclude='.gradle' --exclude='build' --exclude='local.properties' android ../dist-mobile/platforms/
          (cd ../dist-mobile/platforms && zip -qry ../AIProxyLauncher-iOS-XcodeProject.zip ios)

      - name: Upload iOS IPA, Xcode project, and platform scaffold artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIProxyLauncher-iOS-Bundle
          path: |
            dist-mobile/AIProxyLauncher-iOS-unsigned.ipa
            dist-mobile/AIProxyLauncher-iOS-XcodeProject.zip
            dist-mobile/platforms/

      - name: Attach iOS IPA & Xcode project to GitHub Release (on tag or dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "AI 代理启动器 $TAG" --generate-notes
          fi
          gh release upload "$TAG" \
            dist-mobile/AIProxyLauncher-iOS-unsigned.ipa \
            dist-mobile/AIProxyLauncher-iOS-XcodeProject.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

